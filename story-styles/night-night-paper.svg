<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Paper cut-out picture for Night, Night: layered torn dusk-blue sky and sage hills with white deckled edges, a gold sun, a scalloped-cut tree, a sitting cat, a waving child, a moon, and a clay lantern">
<defs>
<filter id="sh" x="-.3" y="-.3" width="1.6" height="1.6">
<feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="b"/>
<feOffset in="b" dx="1.8" dy="3.2" result="o"/>
<feFlood flood-color="#2F2A24" flood-opacity=".32" result="c"/>
<feComposite in="c" in2="o" operator="in" result="s"/>
<feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="sm" x="-.35" y="-.35" width="1.7" height="1.7">
<feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="b"/>
<feOffset in="b" dx="1.1" dy="2" result="o"/>
<feFlood flood-color="#2F2A24" flood-opacity=".28" result="c"/>
<feComposite in="c" in2="o" operator="in" result="s"/>
<feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0" stop-color="#FFE4A4" stop-opacity=".8"/>
<stop offset=".55" stop-color="#E6B454" stop-opacity=".3"/>
<stop offset="1" stop-color="#E6B454" stop-opacity="0"/>
</radialGradient>
</defs>
