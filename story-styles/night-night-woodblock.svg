<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Folk woodblock print of Night, Night: carved charcoal and ochre inks, a pine tree cut with white gouges, a sitting cat, a waving child, a sun, a moon, and a clay lantern">
<defs>
<filter id="wg" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency=".018 .45" numOctaves="2" seed="105" result="n"/>
<feColorMatrix in="n" type="saturate" values="0" result="g"/>
<feComponentTransfer in="g" result="a"><feFuncA type="linear" slope=".2"/></feComponentTransfer>
<feBlend in="SourceGraphic" in2="a" mode="multiply"/>
</filter>
<filter id="ink" x="-.03" y="-.03" width="1.06" height="1.06">
<feTurbulence type="fractalNoise" baseFrequency=".09" numOctaves="1" seed="105" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect width="400" height="300" fill="#F3E6D0" filter="url(#wg)"/>
