eated fairly, no matter their skin color."],["Presidents' Day","3rd Monday of Feb","Started as George Washington's birthday. Now it honors all U.S. presidents."],["Valentine's Day","Feb 14","A day to show love and friendship with cards, hearts, and kind words."],["St. Patrick's Day","Mar 17","Remembers Saint Patrick of Ireland. People wear green and celebrate Irish culture."],["Earth Day","Apr 22","Started in 1970 to remind everyone to take care of our planet."],["Mother's Day","2nd Sunday of May","A day to thank moms and the people who care for us like moms."],["Memorial Day","Last Monday of May","Remembers the soldiers who died serving the United States."],["Father's Day","3rd Sunday of June","A day to thank dads and the people who care for us like dads."],["Juneteenth","June 19","On June 19, 1865, enslaved people in Texas learned they were free. It celebrates freedom."],["Independence Day","July 4","On July 4, 1776, the Declaration of Independence was adopted. It's the birthday of the United States, with fireworks and parades."],["Labor Day","1st Monday of Sept","Honors the workers who build and run the country. It often marks the end of summer."],["Halloween","Oct 31","An old harvest festival. Today kids wear costumes and go trick-or-treating."],["Veterans Day","Nov 11","Thanks everyone who has served in the U.S. military. It began when World War I ended on Nov 11, 1918."],["Thanksgiving","4th Thursday of Nov","A harvest feast to give thanks. It remembers the 1621 meal shared by the Pilgrims and the Wampanoag people."],["Christmas","Dec 25","Christians celebrate the birth of Jesus. Many families share gifts, lights, and time together."]],

pleaños de George Washington. Ahora honra a todos los presidentes de EE. UU."],["San Valentín","14 feb","Un día para mostrar amor y amistad con tarjetas, corazones y palabras amables."],["Día de San Patricio","17 mar","Recuerda a San Patricio de Irlanda. La gente se viste de verde y celebra la cultura irlandesa."],["Día de la Tierra","22 abr","Empezó en 1970 para recordarnos cuidar nuestro planeta."],["Día de la Madre (EE. UU.)","2.º domingo de mayo","Un día para dar gracias a las mamás y a quienes nos cuidan como mamás."],["Memorial Day","último lunes de mayo","Recuerda a los soldados que murieron sirviendo a Estados Unidos."],["Día del Padre","3.er domingo de junio","Un día para dar gracias a los papás y a quienes nos cuidan como papás."],["Juneteenth","19 jun","El 19 de junio de 1865, las personas esclavizadas en Texas supieron que eran libres. Celebra la libertad."],["Día de la Independencia","4 jul","El 4 de julio de 1776 se aprobó la Declaración de Independencia. Es el cumpleaños de Estados Unidos, con fuegos artificiales y desfiles."],["Día del Trabajo (EE. UU.)","1.er lunes de sept","Honra a los trabajadores que construyen y mueven el país. Muchas veces marca el fin del verano."],["Halloween","31 oct","Una antigua fiesta de la cosecha. Hoy los niños se disfrazan y piden dulces."],["Día de los Veteranos","11 nov","Da gracias a quienes han servido en las fuerzas armadas de EE. UU. Empezó cuando terminó la Primera Guerra Mundial, el 11 de noviembre de 1918."],["Acción de Gracias","4.º jueves de nov","Una comida de cosecha para dar gracias. Recuerda la comida de 1621 que compartieron los peregrinos y el pueblo wampanoag."],["Navidad","25 dic","Los cristianos celebran el nacimiento de Jesús. Muchas familias comparten regalos, luces y tiempo juntos."]],

    t.textContent=labels[i];
  });
  const a=ang(d),ex=RX*Math.cos(a),ey=RY*Math.sin(a),tl=23.4*Math.PI/180;
  el("circle",{cx:ex,cy:ey,r:12,fill:"#7aa7d8"},s);
  const hx=Math.cos(a+Math.PI);
  el("path",{d:`M${ex} ${ey-12}A12 12 0 0 ${hx>0?1:0} ${ex} ${ey+12}Z`,fill:"#120e18",opacity:.4},s);
  el("line",{x1:ex+19*Math.sin(-tl),y1:ey-19*Math.cos(tl),x2:ex-19*Math.sin(-tl),y2:ey+19*Math.cos(tl),stroke:"currentColor","stroke-width":2},s);
  const n=el("text",{x:ex+19*Math.sin(-tl)-3,y:ey-22,"font-size":10,fill:"currentColor","text-anchor":"middle"},s);n.textContent="N";
  const dt=new Date(Y,0,d),c=Math.cos(a);
  const lean=hemi==="S"?(c<-.5?T().sumr:c>.5?T().wint:T().mid):(c>.5?T().sumr:c<-.5?T().wint:T().mid);
  $("orbitTxt").innerHTML=`<b>${T().months[dt.getMonth()]} ${dt.getDate()}</b>. ${lean} ${T().now} <b>${T().seasons[seasonOf(d)]}</b>.${d<=10?" "+T().near+".":d>=180&&d<=192?" "+T().far+".":""}`;
  $("t_tilt").textContent=T().tilt;
}

function fillDaySel(selEl, monthEl, keep){
  const m=+monthEl.value, n=new Date(Y,m,0).getDate?new Date(Y,m,0):null;
  const dim=new Date(Y,m,0).getDate(); /* m is 1-12 if value is month number... we'll use 0-11 */
}
function daysIn(m0){return new Date(Y,m0+1,0).getDate()}
function fillDays(daySel, monthIdx, keep){
  const n=daysIn(monthIdx);const cur=keep||+daySel.value||1;
  daySel.innerHTML="";
  for(let d=1;d<=n;d++){const o=document.createElement("option");o.value=d;o.textContent=d;daySel.appendChild(o)}
  daySel.value=String(Math.min(cur,n));
}
function fillMonths(selEl){
  selEl.innerHTML="";
  T().months.forEach((name,i)=>{const o=document.createElement("option");o.value=i;o.textContent=name;selEl.appendChild(o)});
}

function hols(){
  const own=JSON.parse(localStorage.yw_own||"[]"),u=$("hols"),uUS=$("holsUS");
  u.innerHTML="";uUS.innerHTML="";
  const list=T().hols||[];
  list.forEach((row,i)=>{
    const li=document.createElement("li");li.innerHTML=`<b>${row[0]}</b> · ${row[1]}<br><span class="soft">${row[2]}</span>`;
    if(US_IDX.indexOf(i)>=0) uUS.appendChild(li); else u.appendChild(li);
  });
  const u2=$("hols2");u2.innerHTML="";
  (T().hols2||[]).forEach(row=>{const li=document.createElement("li");li.innerHTML=`<b>${row[0]}</b> · ${row[1]}<br><span class="soft">${row[2]}</span>`;u2.appendChild(li)});
  $("t_h2").textContent=T().h2t||"";
  own.forEach((h,i)=>{
    const li=document.createElement("li"),b=document.createElement("button");
    li.textContent=`★ ${h.n} · ${h.d} `;b.textContent=T().del;b.type="button";
    b.onclick=()=>{own.splice(i,1);localStorage.yw_own=JSON.stringify(own);hols()};
    li.appendChild(b);u.appendChild(li);
  });
}
function dateFromSelects(mEl,dEl){
  const m=+mEl.value,d=+dEl.value;
  if(m!==m||d!==d)return "";
  return Y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
}
function untilCount(){
  const v=dateFromSelects($("um"),$("uday"));if(!v)return;
  const[a,b,c]=v.split("-").map(Number),t=new Date(),t0=Date.UTC(t.getFullYear(),t.getMonth(),t.getDate()),n=Math.round((Date.UTC(a,b-1,c)-t0)/864e5);
  $("ures").textContent=n==0?T().today:n>0?T().days(n):T().ago(-n);
}
function goToday(){
  const n=new Date();sel=n.getMonth();$("day").value=doy(n);
  $("hm").value=String(n.getMonth());fillDays($("hd"),n.getMonth(),n.getDate());
  $("um").value=String(n.getMonth());fillDays($("uday"),n.getMonth(),n.getDate());
  wheel();orbit();untilCount();
}

$("hadd").onclick=()=>{
  const n=$("hn").value.trim(),d=dateFromSelects($("hm"),$("hd"));
  if(!n||!d)return;
  const own=JSON.parse(localStorage.yw_own||"[]");own.push({n,d});localStorage.yw_own=JSON.stringify(own);$("hn").value="";hols();
};
$("day").oninput=orbit;
$("lang").onclick=()=>{lang=lang=="en"?"es":"en";localStorage.yw_lang=lang;all()};
$("theme").onclick=themeToggle;
$("hemi").onclick=()=>{hemi=hemi==="N"?"S":"N";localStorage.yw_hemi=hemi;all()};
$("reset").onclick=goToday;
$("hm").onchange=()=>fillDays($("hd"),+$("hm").value,+$("hd").value);
$("um").onchange=()=>{fillDays($("uday"),+$("um").value,+$("uday").value);untilCount()};
$("uday").onchange=untilCount;
$("hd").onchange=()=>{};

function all(){
  const t=T();
  document.documentElement.lang=lang;
  $("t_title").textContent=t.title.replace(/^The /,"") && lang==="en"?"Year Wheel":t.title;
  if(lang==="en") $("t_title").textContent="Year Wheel"; else $("t_title").textContent=t.title;
  $("t_intro").textContent=t.intro;
  $("t_orbit").textContent=t.orbit;
  $("t_hol").textContent=t.hol;
  $("t_saved").textContent=t.saved;
  $("t_until").textContent=TX("until");
  $("t_math").textContent=t.mathT;
  $("lang").textContent=t.btn;
  $("hadd").textContent=t.add;
  $("hn").placeholder=t.name;
  $("math").innerHTML=t.math(Y);
  $("t_slices").textContent=TX("slices");
  $("t_more").textContent=TX("more");
  $("t_us").textContent=TX("us");
  $("t_own").textContent=TX("own");
  $("reset").textContent=TX("reset");
  $("hemi").textContent=hemi==="S"?TX("hemiS"):TX("hemiN");
  const dark=document.documentElement.classList.contains("dark");
  $("theme").textContent=dark?TX("themeDark"):TX("themeLight");
  $("theme").setAttribute("aria-pressed",dark?"true":"false");
  $("back").textContent=TX("back");
  $("back").setAttribute("href","../index.html?from=patterns"+(lang==="es"?"&lang=es":""));
  fillMonths($("hm"));fillMonths($("um"));
  const now=new Date();
  if(!$("hm").value) $("hm").value=String(now.getMonth());
  if(!$("um").value) $("um").value=String(now.getMonth());
  fillDays($("hd"),+$("hm").value,+$("hd").value||now.getDate());
  fillDays($("uday"),+$("um").value,+$("uday").value||now.getDate());
  wheel();orbit();hols();untilCount();
}
themeInit();
$("day").max=YD;$("day").value=doy(new Date());
all();
</script></body></html>
