<script>
const $=id=>document.getElementById(id);

// Safe storage: Brave/Firefox strict privacy can block or throw on localStorage. Fall back to memory.

 del:k=>{delete MEM[k];try{window.localStorage.removeItem(k)}catch(e){STORE_OK=false}}};

const PKEYS=['lamp_log','lamp_notes','lamp_solo','lamp_letters','lamp_start','lamp_echo'];

const getLog=()=>safeJSON(LS.get('lamp_log'),[]);
const setLog=l=>LS.set('lamp_log',JSON.stringify(l));
function show(id){if(typeof stopRead==='function'&&id!=='solo')stopRead();['home','lib','session','log','print','look','about','solo','letters','echo','kids'].forEach(x=>$(x).classList.toggle('hidden',x!==id));render();if(id==='solo')renderSolo();if(id==='letters')renderLetters();if(id==='echo')renderEcho();if(id==='kids')renderKids();if(id==='about')renderAbout()}
function wc(s){return s.text.split(/\s+/).length}
function startLvl(){return LS.get('lamp_start')||'s1'}
function suggest(){const l=getLog();const ord=S.slice().sort((a,b)=>a.g-b.g);if(!l.length)return S.find(s=>s.id===startLvl())||ord[0];
 const last=l[l.length-1];const i=ord.findIndex(s=>s.id===last.story);const acc=last.words?1-last.missed/last.words:1;
 if(acc>=0.95)return ord[Math.min(i+1,ord.length-1)]; // move up

 return ord[Math.max(i-1,0)]; // step down
}
function render(){
 renderLook();
 const sg=suggest();
 $('home').innerHTML=`<div class="card coach"><div class="soft">Tonight's plan · about 12 minutes</div><h2>${sg.t}</h2><p class="soft">${sg.lvl}, focus: ${sg.focus}</p>
 <ol><li><b>Warm-up (2 min):</b> ${sg.coach[0].replace(/^Warm-up: /,"")}</li><li><b>Read together (6–8 min):</b> She reads aloud. You tap the words she finds tricky.</li><li><b>Talk (2–3 min):</b> ${sg.talk[0]}</li><li><b>Log it (30 sec)</b></li></ol>
 <button class="p" onclick="start('${sg.id}')">Begin tonight's session</button> <button onclick="printSheet('${sg.id}')">Printable practice</button></div>
 <div class="card"><p class="soft">Suggestion rule: about 95% of words read correctly means move up a level. 90–94% means stay and reread. Below 90% means step down one story. You can always choose a different story under "Stories."</p>
 <label class="soft">Start at level (used until the first session is logged):</label><select onchange="LS.set('lamp_start',this.value);render()">${S.slice().sort((a,b)=>a.g-b.g).map(s=>`<option value="${s.id}" ${s.id===startLvl()?'selected':''}>${s.lvl}: ${s.t}</option>`).join('')}</select></div>`;
 $('lib').innerHTML='<div class="grid">'+S.slice().sort((a,b)=>a.g-b.g).map(s=>`<div class="card"><div class="soft">${s.lvl}</div><h3>${s.t}</h3><p class="soft">${wc(s)} words · ${s.focus}</p><button class="p" onclick="start('${s.id}')">Read</button> <button onclick="printSheet('${s.id}')">Print</button></div>`).join('')+'</div>';
 const l=getLog();
 $('log').innerHTML=`<div class="card"><h2>Progress log</h2><p class="soft">Saved on this device only.</p>${chart(l)}
 <table><tr><th>Date</th><th>Story</th><th>Level</th><th>Accuracy</th><th>WPM</th><th>Tricky words</th><th>Note</th></tr>${l.slice().reverse().map(e=>{const s=S.find(x=>x.id===e.story)||{};return `<tr><td>${new Date(e.date).toLocaleDateString()}</td><td>${s.t||''}</td><td>${s.g??''}</td><td>${e.words?Math.round(100*(1-e.missed/e.words))+'%':''}</td><td>${e.wpm||'–'}</td><td>${(e.tricky||[]).join(', ')}</td><td>${e.note||''}</td></tr>`}).join('')||'<tr><td colspan=7 class="soft">No sessions yet.</td></tr>'}</table></div>`;
}
function chart(l){if(l.length<1)return'';const W=760,H=140,n=l.length;const pts=l.map((e,i)=>{const s=S.find(x=>x.id===e.story);const x=20+(n==1?W/2:i*(W-40)/(n-1));const y=H-15-(s?s.g:0)/5*(H-30);return[x,y]});
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="background:#faf6ee;border-radius:10px"><text x="4" y="14" font-size="11" fill="#7a6f60">Grade level of stories read over time</text><polyline fill="none" stroke="#5b7a6a" stroke-width="2" points="${pts.map(p=>p.join(',')).join(' ')}"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#5b7a6a"/>`).join('')}</svg>`}
let cur=null,t0=0,tick=null,rec=null;
function start(id){const s=S.find(x=>x.id===id);cur={s,tricky:new Set()};show('session');t0=0;
  $('session').innerHTML=`<div class="card coach"><div class="soft">Coach card · ${s.lvl}</div><ul>${s.coach.map(c=>`<li>${c}</li>`).join('')}</ul><p class="soft">Preview words: <b>${s.words.join(' · ')}</b></p></div>
 <div class="card"><h2>${s.t}</h2><div class="noprint"><button class="p" id="tb" onclick="toggleTimer()">Start reading timer</button> <span class="timer" id="tm">0:00</span>
 <button id="mic" onclick="mic()">🎤 Read-aloud check</button> <span class="soft" id="ms"></span></div>
 <p class="story" id="st">${(()=>{let i=0;return s.text.split('\n').map(line=>line.split(/\s+/).filter(Boolean).map(w=>`<span class="w" data-i="${i++}" onclick="mark(this)">${w}</span>`).join(' ')).join('<br>')})()}</p>
 <div class="card" style="background:#0000;border-style:dashed"><b>💡 Takeaway:</b> ${s.takeaway||''}${s.hook?`<p style="font-size:1.25rem;margin:.6em 0 0"><b>🔁 Say it together, twice:</b> <i>${s.hook}</i></p>`:''}</div></div>
 <div class="card"><h3>Talk about it</h3><ul>${s.talk.map(c=>`<li>${c}</li>`).join('')}</ul>
 <label class="soft">Tonight's session note (optional, saved to the progress log when you press Save)</label><textarea id="note" rows="2" placeholder="e.g. read the comet part with great expression"></textarea>
 <label class="soft">📝 Story notebook (kept for this story, saved as you type, shared by parent and kid)</label><textarea id="snote" rows="3" oninput="saveSN('${s.id}',this.value)" placeholder="Words to revisit, questions she asked, funny things she said...">${esc(getSN()[s.id]||'')}</textarea>
 <p><button class="p" onclick="finish()">Save to progress log</button> <button onclick="show('home')">Leave without saving</button></p></div>`;}
function mark(el){const w=el.textContent;el.classList.toggle('miss');el.classList.contains('miss')?cur.tricky.add(el.dataset.i+'|'+w):cur.tricky.delete(el.dataset.i+'|'+w)}
function toggleTimer(){if(tick){clearInterval(tick);tick=null;$('tb').textContent='Resume timer';return}const base=Date.now()-t0*1000;tick=setInterval(()=>{t0=(Date.now()-base)/1000;$('tm').textContent=Math.floor(t0/60)+':'+String(Math.floor(t0%60)).padStart(2,'0')},250);$('tb').textContent='Pause timer'}
const norm=w=>w.toLowerCase().replace(/[^a-z']/g,'');
function mic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('ms').textContent='Speech check is not available in this browser (it does not work in Brave or Firefox). Tap words by hand instead.';return}
 if(rec){rec.stop();return}rec=new SR();rec.continuous=true;rec.interimResults=true;rec.lang='en-US';const spans=[...document.querySelectorAll('#st .w')];let heard=[];
 rec.onresult=e=>{heard=[];for(const r of e.results)heard.push(...r[0].transcript.split(/\s+/).map(norm).filter(Boolean));
  let j=0;spans.forEach(sp=>{const t=norm(sp.textContent);const k=heard.indexOf(t,j);if(k>=0&&k-j<4){sp.classList.add('ok');j=k+1}})};

 rec.onerror=e=>{$('ms').textContent='Speech check failed ('+e.error+'). It does not work in Brave. Try Chrome or Edge, or tap words by hand.'};rec.start();$('mic').textContent='⏹ Stop listening';$('ms').textContent='Listening…'}
function finish(){if(tick)toggleTimer();if(rec)rec.stop();const n=wc(cur.s);const l=getLog();
 l.push({date:Date.now(),story:cur.s.id,words:n,missed:cur.tricky.size,tricky:[...cur.tricky].map(x=>x.split('|')[1].replace(/[^\w']/g,'')),wpm:t0>10?Math.round(n/(t0/60)):null,note:$('note').value});setLog(l);show('log')}
function printSheet(id){const s=S.find(x=>x.id===id);const tr=[...new Set(getLog().flatMap(e=>e.tricky||[]))].slice(-8);show('print');

 <h2>Practice sheet: ${s.t}</h2><p>Name: ____________ &nbsp; Date: ________</p><p><b>Focus:</b> ${s.focus}</p>
 <h3>1. Read these words. Circle the tricky part.</h3><p style="font-size:1.5rem;word-spacing:1.2em">${s.words.join(' ')}</p>
 ${tr.length?`<h3>2. Words from your log to practice again</h3><p style="font-size:1.4rem;word-spacing:1em">${tr.join(' ')}</p>`:''}
 <h3>${tr.length?3:2}. Write a sentence using two of the words above.</h3><p>__________________________________________________</p><p>__________________________________________________</p>
 <h3>Talk or draw</h3><p>${s.talk[1]}</p><div style="border:1px dashed #aaa;height:160px;border-radius:10px"></div>
 <p class="soft">Grown-up: spend 5 minutes on this sheet, not more. Counts as a session too.</p></div>`}
function getSN(){return safeJSON(LS.get('lamp_notes'),{})}
function saveSN(id,v){const n=getSN();n[id]=v;LS.set('lamp_notes',JSON.stringify(n))}
function esc(t){return t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
const THEMES={warm:['#f6f1e7','#2f2a24','#fffdf8','#5b7a6a','Warm paper'],sepia:['#efe1c6','#4a3524','#f7ecd6','#8a5a2b','Sepia'],dark:['#1d1f24','#e8e4da','#2a2d34','#7fa890','Night (dark)'],contrast:['#000000','#ffffff','#111111','#ffd400','High contrast'],pastel:['#e9f1f7','#1f2a44','#fdf9ec','#4a6fa5','Calm pastel (dyslexia-friendly)'],mint:['#e7f4ec','#203a2c','#f6fbf7','#3f8a62','Mint']};
const FONTS={serif:['Georgia, "Times New Roman", serif','Storybook (Georgia)'],sans:['Verdana, "Segoe UI", Arial, sans-serif','Clear (Verdana)'],lexend:['Lexend, "Atkinson Hyperlegible", Verdana, Tahoma, sans-serif','Lexend-style (easy reading)'],dys:['OpenDyslexic, "Comic Sans MS", "Comic Neue", Verdana, sans-serif','OpenDyslexic-style'],round:['"Trebuchet MS", "Nunito", Verdana, sans-serif','Rounded (Trebuchet)']};

function applyLook(){const L=getLook(),t=THEMES[L.theme]||THEMES.warm,r=document.documentElement.style;
 r.setProperty('--bg',L.bg||t[0]);r.setProperty('--ink',L.fg||t[1]);r.setProperty('--card',L.bg?L.bg:t[2]);r.setProperty('--acc',t[3]);r.setProperty('--soft',L.fg||t[1]);

 const dark=parseInt(bgc.slice(1,3),16)+parseInt(bgc.slice(3,5),16)+parseInt(bgc.slice(5,7),16)<384;document.documentElement.style.colorScheme=dark?'dark':'light';
 const m=document.querySelector('meta[name=theme-color]');if(m)m.content=bgc;}
function renderLook(){const L=getLook();$('look').innerHTML=`<div class="card big"><h2>🎨 Look & feel</h2>
 <h3>Color theme</h3>${Object.entries(THEMES).map(([k,t])=>`<button class="swatch" style="background:${t[0]};color:${t[1]};border:3px solid ${L.theme===k?t[3]:'#ccc'}" onclick="setLook('theme','${k}')">${t[4]}</button>`).join('')}
 <h3>My own colors</h3><label>Text color <input type="color" value="${L.fg||THEMES[L.theme][1]}" oninput="setLook('fg',this.value,1)" onchange="setLook('fg',this.value,1)" onblur="setLook('fg',this.value,1)" style="width:80px;height:50px"></label> &nbsp; <label>Background <input type="color" value="${L.bg||THEMES[L.theme][0]}" oninput="setLook('bg',this.value,1)" onchange="setLook('bg',this.value,1)" onblur="setLook('bg',this.value,1)" style="width:80px;height:50px"></label>
 <h3>Story text size: <span id="lbl_fs">${L.fs.toFixed(1)}</span></h3><input type="range" min="1.1" max="3" step="0.1" value="${L.fs}" oninput="setLook('fs',+this.value,1)" onchange="setLook('fs',+this.value,1)">
 <h3>Line spacing: <span id="lbl_lh">${(+L.lh).toFixed(1)}</span></h3><input type="range" min="1.3" max="3" step="0.1" value="${L.lh}" oninput="setLook('lh',+this.value,1)" onchange="setLook('lh',+this.value,1)">
 <h3>Font</h3>${Object.entries(FONTS).map(([k,f])=>`<button style="font-family:${f[0].replace(/"/g,"'")};border:3px solid ${L.ff===k?'var(--acc)':'#ccc'}" onclick="setLook('ff','${k}')">${f[1]}</button>`).join('')}
 <p class="story" style="margin-top:14px">The quick fox jumps. Read me to test your settings!</p>
 <p class="soft">No fonts are downloaded, to keep the app private and offline. "Lexend" and "OpenDyslexic" are used if they're installed on this device. Otherwise the app falls back to similar easy-to-read fonts.</p>
 <button onclick="LS.del('lamp_look');applyLook();renderLook()">Reset to default</button> <span class="soft">App version ${APP_VERSION}</span> <button onclick="repairApp()">Repair / update app</button>${STORE_OK?"":"<p class=\"soft\"><b>Note:</b> this browser is blocking site storage (privacy setting), so settings only last until you close the tab. In Brave, set Shields to allow cookies for this site. In Firefox, allow cookies for this site.</p>"}</div>`}
function exportLog(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({log:getLog(),storyNotes:getSN(),look:getLook()},null,2)],{type:'application/json'}));a.download='lamplight-log.json';a.click()}
async function repairApp(){try{const rs=await navigator.serviceWorker?.getRegistrations?.()||[];for(const r of rs)await r.unregister();const ks=await caches?.keys?.()||[];for(const k of ks)await caches.delete(k)}catch(e){}location.reload()}
(async()=>{try{if(location.protocol==='file:')return;const r=await fetch('version.json?'+Date.now(),{cache:'no-store'});const v=(await r.json()).version;
 if(v>APP_VERSION&&!sessionStorage.getItem('lamp_fix')){sessionStorage.setItem('lamp_fix','1');repairApp()}}catch(e){}})();
// ---------- v7: speech helper ----------
function speak(t,rate){try{if(!('speechSynthesis' in window))return null;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=rate||0.85;u.lang=window.SPEAK_LANG||'en-US';speechSynthesis.speak(u);return u}catch(e){return null}}
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
// ---------- v7: Letters game (uppercase <-> lowercase) ----------
const AB='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const getLet=()=>safeJSON(LS.get('lamp_letters'),{});
function letGot(L){const p=getLet();p[L]=(p[L]||0)+1;LS.set('lamp_letters',JSON.stringify(p))}
let LG={mode:'find',say:true,set:'all'};
function letPool(){return LG.set==='all'?AB:LG.set==='a-m'?AB.slice(0,13):AB.slice(13)}
function renderLetters(){const p=getLet(),known=AB.filter(L=>(p[L]||0)>=3).length;
 const head=`<div class="card big"><h2>🔤 Big letters, little letters</h2><p class="soft">Every letter has a big (uppercase) shape and a little (lowercase) shape. Same letter, same sound.</p>
 <button class="${LG.mode==='find'?'p':''}" onclick="LG.mode='find';renderLetters()">Find the little letter</button><button class="${LG.mode==='pairs'?'p':''}" onclick="LG.mode='pairs';renderLetters()">Match pairs</button>
 <select style="width:auto" onchange="LG.set=this.value;renderLetters()"><option value="all" ${LG.set==='all'?'selected':''}>A–Z</option><option value="a-m" ${LG.set==='a-m'?'selected':''}>A–M</option><option value="n-z" ${LG.set==='n-z'?'selected':''}>N–Z</option></select>
 <label class="soft" style="display:inline"><input type="checkbox" style="width:auto" ${LG.say?'checked':''} onchange="LG.say=this.checked"> 🔊 Say letters out loud</label>
 <div id="lgame" style="text-align:center;margin-top:12px"></div>
 <p class="soft">Letters learned (matched 3+ times): <b id="lk">${known}</b> / 26</p><p style="word-spacing:6px">${AB.map(L=>`<span title="${p[L]||0}" style="opacity:${(p[L]||0)>=3?1:.3}">${L}${L.toLowerCase()}</span>`).join(' ')}</p></div>`;
 $('letters').innerHTML=head;LG.mode==='find'?findRound():pairsRound()}
function findRound(){const pool=letPool(),T=pool[Math.floor(Math.random()*pool.length)];const opts=shuf([T,...shuf(AB.filter(x=>x!==T)).slice(0,3)]);
 $('lgame').innerHTML=`<p style="font-size:1.4rem">Find the little letter for</p><div class="tile" style="display:inline-flex;align-items:center;justify-content:center;font-size:clamp(4rem,16vw,7rem)" onclick="LG.say&&speak('${T}')">${T}</div><div>${opts.map(o=>`<button class="tile" onclick="findPick(this,'${o}','${T}')">${o.toLowerCase()}</button>`).join('')}</div><p id="lfb" style="font-size:1.3rem;min-height:1.6em"></p>`;
 if(LG.say)speak('Find the little letter for '+T)}
function findPick(b,o,T){if(o===T){b.classList.add('yes');letGot(T);$('lfb').textContent='⭐ Yes! Big '+T+' and little '+T.toLowerCase()+' match!';if(LG.say)speak('Yes! '+T+'.');setTimeout(()=>{const k=$('lk');renderLetters()},1300)}
 else{b.classList.remove('no');void b.offsetWidth;b.classList.add('no');$('lfb').textContent='Almost! That one is little '+o.toLowerCase()+'. Try again.';if(LG.say)speak('That is '+o+'. Try again.')}}
let PR=null;
function pairsRound(){const ls=shuf(letPool()).slice(0,4);PR={sel:null,left:4};
 $('lgame').innerHTML=`<p style="font-size:1.3rem">Tap a big letter, then its little letter.</p><div>${shuf(ls).map(L=>`<button class="tile" data-k="${L}" data-u="1" onclick="pairTap(this)">${L}</button>`).join('')}</div><div>${shuf(ls).map(L=>`<button class="tile" data-k="${L}" data-u="0" onclick="pairTap(this)">${L.toLowerCase()}</button>`).join('')}</div><p id="lfb" style="font-size:1.3rem;min-height:1.6em"></p>`}
function pairTap(b){if(b.classList.contains('done'))return;if(LG.say)speak(b.dataset.k);
 if(!PR.sel||PR.sel.dataset.u===b.dataset.u){if(PR.sel)PR.sel.classList.remove('sel');PR.sel=b;b.classList.add('sel');return}
 const a=PR.sel;a.classList.remove('sel');PR.sel=null;
 if(a.dataset.k===b.dataset.k){a.classList.add('done');b.classList.add('done');letGot(b.dataset.k);PR.left--;$('lfb').textContent='⭐ '+b.dataset.k+' and '+b.dataset.k.toLowerCase()+' match!';if(!PR.left){$('lfb').textContent='🌟 All matched! Great job!';if(LG.say)speak('All matched! Great job!');setTimeout(renderLetters,1600)}}
 else{[a,b].forEach(x=>{x.classList.remove('no');void x.offsetWidth;x.classList.add('no')});$('lfb').textContent='Not a match yet. Try again!'}}
// ---------- v7: Solo reading (kid alone) ----------
const getSolo=()=>safeJSON(LS.get('lamp_solo'),{});
let SO=null,readTimer=null;
function soloQs(s){if(s.q)return s.q;const other=shuf([...new Set(S.filter(x=>x.id!==s.id).flatMap(x=>x.words))].filter(w=>!s.words.includes(w))).slice(0,2);return [['Which word was in the story?',[s.words[0],...other],0]]}
let SOG='early',SOT='';
function renderSolo(){stopRead();const sv=getSolo();const tags=[...new Set(S.flatMap(s=>s.tags||[]))].sort();
 const list=S.filter(s=>(SOG==='early'?s.g<3:s.g>=3)&&(!SOT||(s.tags||[]).includes(SOT))).sort((a,b)=>a.g-b.g);
 $('solo').innerHTML=`<div class="card big" style="text-align:center"><h2>⭐ Solo reading</h2><p style="font-size:1.2rem">Pick a story. Tap any word to hear it.</p><p class="stars">${'⭐'.repeat(Math.min(Object.values(sv).reduce((n,x)=>n+(x.stars||0),0),30))||'☆'}</p>
 <button class="bigbtn ${SOG==='early'?'p':''}" onclick="SOG='early';renderSolo()">Pre-K – Grade 2</button><button class="bigbtn ${SOG==='big'?'p':''}" onclick="SOG='big';renderSolo()">Grades 3 – 5</button>
 <p>${['',...tags].map(t=>`<button style="margin:3px" class="${SOT===t?'p':''}" onclick="SOT='${t}';renderSolo()">${t||'All'}</button>`).join('')}</p></div>
 <div class="grid">${list.map(s=>`<button class="card" style="text-align:left;font-size:1.2rem" onclick="soloStart('${s.id}')"><b>${s.t}</b><br><span class="soft">${s.lvl.split('·')[0]} · ${wc(s)} words</span> ${sv[s.id]?'⭐'.repeat(sv[s.id].stars):''}</button>`).join('')||'<p class="soft">No stories with that tag yet.</p>'}</div>`}
function soloStart(id){const s=S.find(x=>x.id===id);SO={s,qi:0,right:0};let i=0;
 $('solo').innerHTML=`<div class="card big"><div style="position:sticky;top:0;background:var(--card);z-index:2;padding:4px 0"><button class="bigbtn" onclick="renderSolo()">⬅ Back</button> <button class="bigbtn p" id="rtm" onclick="readToMe()">🔊 Read to me</button></div>
 <h2>${s.t}</h2><p class="story" id="sst">${s.text.split('\n').map(line=>line.split(/\s+/).filter(Boolean).map(w=>`<span class="w sw" data-i="${i++}" onclick="speak(this.textContent.replace(/[^\\w']/g,''),0.7)">${w}</span>`).join(' ')).join('<br>')}</p>
 <p style="text-align:center"><button class="bigbtn p" style="font-size:1.8rem" onclick="soloDone()">🌟 I read it!</button></p></div>`}
function stopRead(){if(readTimer){clearTimeout(readTimer);readTimer=null}try{speechSynthesis.cancel()}catch(e){}document.querySelectorAll('.sw.say').forEach(x=>x.classList.remove('say'));const b=$('rtm');if(b)b.textContent='🔊 Read to me'}
function readToMe(){if(readTimer||document.querySelector('.sw.say')){stopRead();return}const sp=[...document.querySelectorAll('#sst .sw')];let k=0;$('rtm').textContent='⏹ Stop';
 const step=()=>{sp.forEach(x=>x.classList.remove('say'));if(k>=sp.length||!$('sst')){stopRead();return}const el=sp[k++];el.classList.add('say');if(k%8===1)el.scrollIntoView({block:'center',behavior:'smooth'});const w=el.textContent.replace(/[^\w']/g,'');
  const u=w?speak(w,0.8):null;let next=false;const go=()=>{if(next)return;next=true;readTimer=setTimeout(step,/[.!?]$/.test(el.textContent)?350:80)};
  if(u){u.onend=go;u.onerror=go}readTimer=setTimeout(go,u?Math.max(700,w.length*160):550)};step()}
function soloDone(){stopRead();speak('You read it! Great job!');SO.qs=soloQs(SO.s);SO.qi=0;SO.right=0;soloQ()}
function soloQ(){const s=SO.s;if(SO.qi>=SO.qs.length){const stars=1+(SO.right===SO.qs.length?1:0)+(SO.right>0?1:0);const sv=getSolo();sv[s.id]={stars:Math.max(stars,(sv[s.id]||{}).stars||0),date:Date.now(),right:SO.right,of:SO.qs.length};LS.set('lamp_solo',JSON.stringify(sv));
  $('solo').innerHTML=`<div class="card big" style="text-align:center"><h2>🌟 You read “${s.t}”!</h2><p class="stars" style="font-size:3.5rem">${'⭐'.repeat(stars)}</p><p style="font-size:1.3rem">🔁 ${s.hook||''}</p><button class="bigbtn p" onclick="renderSolo()">Pick another story</button> <button class="bigbtn" onclick="soloStart('${s.id}')">Read it again</button></div>`;speak(stars+' stars!');return}
 const [q,ch,c]=SO.qs[SO.qi];const opts=shuf(ch.map((t,i)=>({t,ok:i===c})));
 $('solo').innerHTML=`<div class="card big" style="text-align:center"><p class="soft">Question ${SO.qi+1} of ${SO.qs.length}</p><h2 onclick="speak(this.textContent)" style="cursor:pointer">🔊 ${q}</h2>${opts.map(o=>`<button class="bigbtn" onclick="soloAns(this,${o.ok})">${o.t}</button>`).join('')}<p id="qfb" style="font-size:1.3rem;min-height:1.6em"></p><button onclick="renderSolo()">⬅ Back to stories</button></div>`;speak(q)}
function soloAns(b,ok){if(ok){b.classList.add('yes');SO.right+=SO.tried?0:1;SO.tried=false;$('qfb').textContent='⭐ Yes!';speak('Yes!');SO.qi++;setTimeout(soloQ,1000)}else{SO.tried=true;b.disabled=true;b.style.opacity=.4;$('qfb').textContent='Good try! Pick another one.';speak('Good try. Pick another one.')}}

applyLook();renderBar();render();$("home").classList.add("hidden");
if('serviceWorker' in navigator&&location.protocol!=='file:'){const hadSW=!!navigator.serviceWorker.controller;navigator.serviceWorker.register('sw.js',{scope:'./'}).then(r=>r.update());let rl=0;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!rl&&hadSW){rl=1;location.reload()}})}
